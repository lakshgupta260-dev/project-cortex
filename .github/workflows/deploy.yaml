name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to Azure Container Registry
      run: |
        az acr login --name cortexregistry123

    - name: Build Docker image
      run: |
        docker build -t cortexregistry123.azurecr.io/cortex-api:${{ github.sha }} .

    - name: Push Docker image
      run: |
        docker push cortexregistry123.azurecr.io/cortex-api:${{ github.sha }}

    - name: Deploy to Azure Container App
      run: |
        az containerapp update \
          --name cortex-api-app \
          --resource-group projectcortex-rg \
          --image cortexregistry123.azurecr.io/cortex-api:${{ github.sha }}